<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#27ae60">
    <title>Вход — Базар Учёт</title>
    <link rel="apple-touch-icon" href="/static/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Базар Учёт">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: linear-gradient(135deg, #eafaf1 0%, #f4f6f8 55%, #e8f0fe 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            padding: 30px 24px;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.10);
        }
        .logo { font-size: 3rem; text-align: center; margin-bottom: 6px; }
        h1 { margin: 0 0 8px; text-align: center; font-size: 1.45rem; color: #27ae60; }
        .subtitle { margin: 0 0 22px; text-align: center; color: #777; font-size: 0.92rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin: 12px 0 5px; color: #555; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus { border-color: #27ae60; box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.15); }
        button {
            width: 100%;
            margin-top: 20px;
            border: none;
            border-radius: 9px;
            padding: 13px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: #27ae60;
            cursor: pointer;
        }
        button:disabled { opacity: 0.7; cursor: wait; }
        .error {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #fdecea;
            color: #c0392b;
            font-size: 0.9rem;
            text-align: center;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🛒</div>
        <h1>Базар Учёт</h1>
        <p class="subtitle">Вход только для своих</p>

        <form id="loginForm">
            <label for="username">Логин</label>
            <input id="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Пароль</label>
            <input id="password" type="password" autocomplete="current-password" required>

            <button type="submit" id="submitBtn">Войти</button>
            <div class="error" id="error"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        // Сервис-воркер кэширует страницу, чтобы она открывалась и без интернета.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }

        // Если вход уже был на этом телефоне — не держим человека на логине.
        (async function alreadyLoggedIn() {
            try {
                const res = await fetch('/auth/me', { cache: 'no-store' });
                if (res.ok) {
                    window.location.href = '/';
                    return;
                }
            } catch (err) {
                if (localStorage.getItem('bazar_auth_v1') === '1') {
                    window.location.href = '/';
                }
            }
        })();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Проверяю...';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                if (res.ok) {
                    localStorage.setItem('bazar_auth_v1', '1');
                    window.location.href = '/';
                    return;
                }

                const data = await res.json().catch(() => ({}));
                errorBox.textContent = data.detail || 'Неверный логин или пароль';
                errorBox.classList.add('show');
            } catch (err) {
                errorBox.textContent = 'Нет интернета. Первый вход возможен только при наличии связи — попробуйте позже.';
                errorBox.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Войти';
            }
        });
    </script>
</body>
</html>
